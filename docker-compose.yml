version: "3.8"

services:
  telegram-cloner:
    build: .
    container_name: tg-cloner
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - tg-data:/app/data
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tgclone
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: tg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tgclone
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tgclone"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tg-data:
    driver: local
  pg-data:
    driver: local
